[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"eval/*" = ["S603", "S607", "S310"]
# table names come from trusted config; every value is a bound query parameter
"src/api/retrieval.py" = ["S608"]
"src/ingest/main.py" = ["S608"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
