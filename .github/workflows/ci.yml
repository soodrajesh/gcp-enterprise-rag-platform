name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write        # WIF token exchange
  pull-requests: write

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: ruff check src tests eval && ruff format --check src tests eval
      - run: pytest -q

  iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.10.5" }
      - run: terraform -chdir=terraform fmt -check -recursive
      - run: terraform -chdir=terraform init -backend=false && terraform -chdir=terraform validate
      - name: Checkov (IaC policy scan)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          soft_fail: true
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
      - name: Trivy (config + secrets + deps)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "0"

  plan:
    # Real `terraform plan` against the live project using the READ-ONLY identity.
    if: github.event_name == 'pull_request' && vars.WIF_PROVIDER != ''
    needs: iac
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CI_PLAN_SA }}
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.10.5" }
      - run: terraform -chdir=terraform init -backend-config="bucket=${{ vars.GCP_PROJECT }}-tfstate"
      - run: >
          terraform -chdir=terraform plan -lock=false -no-color
          -var project_id=${{ vars.GCP_PROJECT }}
          -var billing_account_id=${{ vars.BILLING_ACCOUNT }}
          -var alert_email=${{ vars.ALERT_EMAIL }}
          -var admin_email=${{ vars.ALERT_EMAIL }}
